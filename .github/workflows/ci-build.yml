name: "CI Build"

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  SaveVersion:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./build/ci/actions/klogg-version

      - name: Save version 
        run: echo $KLOGG_VERSION > klogg_version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: klogg_version
          path: 'klogg_version.txt'
          if-no-files-found: error

  # Fast, focused signal for the Qt-facing part of the Core API: the suite needs
  # a QGuiApplication host and the Qt settings documents, so it builds on this
  # line and not on the Qt-free one. The Qt-free engine suites live in
  # desktop-ci.yml.
  ApiTests:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: API unit tests (Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 python-is-python3 \
            qt6-base-dev qt6-5compat-dev qt6-translations-l10n \
            qt6-tools-dev-tools qt6-base-dev-tools qt6-tools-dev \
            libboost-dev libicu-dev libssl-dev libcurl4-openssl-dev \
            ragel ninja-build zlib1g-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: .cpm_cache
          key: cpm-api-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '3rdparty/CMakeLists.txt') }}
          restore-keys: |
            cpm-api-${{ runner.os }}-

      - name: Configure API tests
        run: >
          cmake -S . -B out/api -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKLOGG_BUILD_TESTS=ON
          -DKLOGG_USE_LTO=OFF
          -DKLOGG_USE_HYPERSCAN=OFF
          -DKLOGG_USE_VECTORSCAN=OFF
          -DKLOGG_USE_SENTRY=OFF
          -DKLOGG_USE_PERFETTO=OFF
          -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cpm_cache

      - name: Build API unit tests
        # -k 0: keep going after a failed TU so one run reports every error
        run: cmake --build out/api --target klogg_api_tests --parallel 2 -- -k 0

      - name: Run API unit tests
        run: ctest --test-dir out/api -R '^klogg_api_tests$' --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  Linux:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu_jammy
            os_version: 22.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: jammy
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: build/ci/docker/ubuntu22.04
            container: variar/klogg_ubuntu22.04
            cmake_opts:

          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            check_command: apt-get update && apt install --dry-run /usr/local/klogg*.deb
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: build/ci/docker/ubuntu24.04
            container: variar/klogg_ubuntu24.04
            cmake_opts:

          - os: ubuntu_appimage
            os_version: 24.04
            arch: x64
            artifacts_id: appimage
            package_suffix: AppImage
            container_root: build/ci/docker/ubuntu24.04
            container: variar/klogg_ubuntu24.04
            cmake_opts:


    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      #- uses: satackey/action-docker-layer-caching@v0.0.11
      #  # Ignore the failure of a step and avoid terminating the job.
      #  continue-on-error: true
      
      - name: Build container 
        run: |
          cd ${{ matrix.config.container_root }}
          docker build -t ${{ matrix.config.container }} .

      - uses: ./build/ci/actions/klogg-version
      - uses: ./build/ci/actions/prepare-workspace-env

      # CPM fetches the pinned dependencies into the workspace, which the
      # container sees as /usr/local/cpm_cache. Cache it on the host so a run
      # does not refetch everything.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-linux-${{ hashFiles('CMakeLists.txt', '3rdparty/CMakeLists.txt') }}
          restore-keys: |
            cpm-linux-

      - uses: ./build/ci/actions/docker-build
      - uses: ./build/ci/actions/docker-run-tests
      - uses: ./build/ci/actions/docker-package
          
# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error      

  Mac:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos
            # macOS 14 images were retired from GitHub Actions on 2026-11-02,
            # so the job is cancelled at creation with "configuration not
            # supported". macos-15 is the currently supported arm64 image.
            os_version: 15
            qt_version: 6.7.3
            qt_arch: clang_64
            qt_modules: qt5compat
            arch: arm64
            artifacts_id: macos-arm-qt6
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode
        shell: sh
        # Xcode 16.4 is the default toolchain on the macos-15 image (15.2 is not
        # installed there anymore).
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

#Install build deps
      - name: Set brew env
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          brew install ragel

      - uses: ./build/ci/actions/agent-setup
      - uses: ./build/ci/actions/klogg-version
      - uses: ./build/ci/actions/prepare-workspace-env

      # agent-build points CPM at $KLOGG_WORKSPACE/cpm_cache; without this the
      # configure step refetches every dependency on each run.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-macos-${{ hashFiles('CMakeLists.txt', '3rdparty/CMakeLists.txt') }}
          restore-keys: |
            cpm-macos-

      - uses: ./build/ci/actions/agent-build
      - uses: ./build/ci/actions/agent-run-tests
      - uses: ./build/ci/actions/agent-package-mac
        with:
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*' 
          if-no-files-found: error

  Windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.7.3
            qt_modules: qt5compat
            qt_arch: win64_msvc2019_64
            arch: x64
            ssl_arch: -x64
            cmake_opts:
            artifacts_id: windows-x64-qt6

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    steps:
      - uses: actions/checkout@v4

      # Qt 6.7 dropped the OpenSSL 1.1 backend and only supports OpenSSL 3, so
      # the runtime DLLs bundled by prepare_release.cmd come from a 3.x build.
      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\openssl-3
          key: OpensslCache-3-5-9

      - name: Download openssl
        if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.9.zip" -OutFile openssl.zip
          7z x openssl.zip -oopenssl-3 -y

      - name: Set openssl paths
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "${{ github.workspace }}\openssl-3" -Recurse -Filter "libssl-3-x64.dll" | Select-Object -First 1
          if (-not $dll) { throw "libssl-3-x64.dll not found in the OpenSSL archive" }
          "SSL_DIR=$($dll.DirectoryName)" >> $env:GITHUB_ENV
          "SSL_ARCH=${{ matrix.config.ssl_arch }}" >> $env:GITHUB_ENV

      - uses: ./build/ci/actions/agent-setup
      - uses: ./build/ci/actions/klogg-version
      - uses: ./build/ci/actions/prepare-workspace-env

      # agent-build points CPM at $KLOGG_WORKSPACE/cpm_cache; without this the
      # configure step refetches every dependency on each run.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-windows-${{ hashFiles('CMakeLists.txt', '3rdparty/CMakeLists.txt') }}
          restore-keys: |
            cpm-windows-

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./build/ci/actions/agent-build
      - uses: ./build/ci/actions/agent-run-tests
      - uses: ./build/ci/actions/agent-package-win
        with:
          s3-key-id: ${{ secrets.WIN_CS_KEY_ID }}
          s3-secret: ${{ secrets.WIN_CS_SECRET }}
          s3-bucket: ${{ secrets.WIN_CS_BUCKET }}
     
# Final upload of all packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.config.artifacts_id }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
