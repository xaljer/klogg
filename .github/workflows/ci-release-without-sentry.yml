name: "Make CI Release (without sentry)"

on:
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Run ID of CI workflow"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Download artifacts for last successful CI workflow
      if: ${{ !github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        workflow_conclusion: success

    - name: Download artifacts for CI workflow with provided run id
      if: ${{ github.event.inputs.ci-run-id }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: ci-build.yml
        run_id: ${{ github.event.inputs.ci-run-id }}

    - name: Initialize version
      run: echo "KLOGG_VERSION=`cat klogg_version/klogg_version.txt`" >> $GITHUB_ENV

    - name: Display structure of downloaded files
      run: ls -R ./packages-*

    - name: Cleanup release artifacts
      shell: sh
      run: |
        # Debug symbols are optional in without-sentry flow.
        # Known case: oracle debug symbols may be missing because Oracle build uses -DKLOGG_USE_SENTRY=OFF in ci-build.yml.
        [ -f ./packages-focal/klogg_focal.debug.xz ] && xz -d ./packages-focal/klogg_focal.debug.xz || echo "warn: missing focal debug symbols"
        [ -f ./packages-jammy/klogg_jammy.debug.xz ] && xz -d ./packages-jammy/klogg_jammy.debug.xz || echo "warn: missing jammy debug symbols"
        [ -f ./packages-noble/klogg_noble.debug.xz ] && xz -d ./packages-noble/klogg_noble.debug.xz || echo "warn: missing noble debug symbols"
        [ -f ./packages-oracle/klogg_oracle.debug.xz ] && xz -d ./packages-oracle/klogg_oracle.debug.xz || echo "warn: missing oracle debug symbols (known)"
        [ -f ./packages-appimage/klogg_appimage.debug.xz ] && xz -d ./packages-appimage/klogg_appimage.debug.xz || echo "warn: missing appimage debug symbols"
        rm -rf ./packages-focal/klogg_focal
        rm -rf ./packages-jammy/klogg_jammy
        rm -rf ./packages-noble/klogg_noble
        rm -rf ./packages-oracle/klogg_oracle
        rm -rf ./packages-appimage/klogg_appimage
        rm -rf ./packages-macos-arm-qt6/klogg-arm64.app
        mkdir ./linux-debug
        [ -f ./packages-focal/klogg_focal.debug ] && mv ./packages-focal/klogg_focal.debug ./linux-debug
        [ -f ./packages-jammy/klogg_jammy.debug ] && mv ./packages-jammy/klogg_jammy.debug ./linux-debug
        [ -f ./packages-noble/klogg_noble.debug ] && mv ./packages-noble/klogg_noble.debug ./linux-debug
        [ -f ./packages-oracle/klogg_oracle.debug ] && mv ./packages-oracle/klogg_oracle.debug ./linux-debug
        [ -f ./packages-appimage/klogg_appimage.debug ] && mv ./packages-appimage/klogg_appimage.debug ./linux-debug
        if ls ./linux-debug/*.debug >/dev/null 2>&1; then tar -cJf ./linux-debug/klogg-$KLOGG_VERSION-symbols.tar.xz ./linux-debug/*; rm ./linux-debug/*.debug; else echo "warn: no linux debug symbols packaged"; fi

    - name: Prepare binary artifacts
      shell: sh
      run: |
        mkdir ./packages-bin
        mv ./packages-appimage/klogg_deps.tar.xz ./packages-bin/klogg-$KLOGG_VERSION-deps.tar.xz
        ar p  ./packages-focal/klogg-$KLOGG_VERSION-focal.deb data.tar.gz > ./packages-bin/klogg-$KLOGG_VERSION-bin.tar.gz
        mv ./klogg_version/klogg_version.txt ./packages-bin

    - name: Prepare checksums
      shell: sh
      run: |
        sha256sum --binary ./packages-bin/* ./packages-focal/* ./packages-jammy/* ./packages-noble/* ./packages-oracle/* ./packages-appimage/*  > ./packages-bin/klogg-$KLOGG_VERSION-sha256.txt
        
    - name: Release win
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: ${{ secrets.KLOGG_GITHUB_TOKEN || github.token }}
        automatic_release_tag: continuous-win
        prerelease: true
        files: |
          ./packages-windows-x86-qt5/*
          ./packages-windows-x64-qt6/*

    - name: Release linux
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: ${{ secrets.KLOGG_GITHUB_TOKEN || github.token }}
        automatic_release_tag: continuous-linux
        prerelease: true
        files: |
          ./packages-focal/*
          ./packages-jammy/*
          ./packages-noble/*
          ./packages-oracle/*
          ./packages-appimage/*
          ./packages-bin/*
          ./linux-debug/*

    - name: Release mac
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: ${{ secrets.KLOGG_GITHUB_TOKEN || github.token }}
        automatic_release_tag: continuous-osx
        prerelease: true
        files: |
          ./packages-macos-arm-qt6/*

    - name: Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_NEW_VERSIONS_WEBHOOK }}
        DISCORD_EMBEDS: '[{"title": "Windows", "url": "https://github.com/variar/klogg/releases/tag/continuous-win"}, {"title": "Linux", "url": "https://github.com/variar/klogg/releases/tag/continuous-linux"}, {"title": "Mac", "url": "https://github.com/variar/klogg/releases/tag/continuous-osx"}]'
      uses: Ilshidur/action-discord@master
      with:
        args: 'New CI build {{KLOGG_VERSION}} has been released!'
